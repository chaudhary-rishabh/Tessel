version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates arrive as one pull request per week.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories:
      - /infra/docker
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directories:
      - /infra/deploy
      - /infra/docker
    schedule:
      interval: monthly
