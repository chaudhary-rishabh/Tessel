name: Live evals

# Runs every eval suite against the real AI gateway: the models' actual
# quality, latency, and cost. Nightly, and on demand from the Actions tab.
#
# Does nothing until the AI_GATEWAY_API_KEY repository secret is set, so it
# never spends money by accident. The report is in the run summary and as an
# artifact. To refresh the recordings CI replays, run the same command locally
# with --record and commit the cassettes folders next to each suite.
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Suites to run (comma-separated; empty for all)
        required: false
        default: ""
      trials:
        description: Times to run each case
        required: false
        default: "1"

concurrency:
  group: live-evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evals:
    name: Evals against the AI gateway
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - name: Check for the gateway key
        id: key
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "Set the AI_GATEWAY_API_KEY repository secret to run live evals." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run live evals
        if: steps.key.outputs.present == 'true'
        run: |
          args=(--mode live --trials "${TRIALS:-1}")
          if [ -n "$SUITE" ]; then args+=(--suite "$SUITE"); fi
          pnpm evals "${args[@]}"
        env:
          SUITE: ${{ inputs.suite }}
          TRIALS: ${{ inputs.trials }}

      - name: Upload the report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-evals
          path: .evals/
          retention-days: 30
