name: Deploy

# Runs after CI passes on main. Builds the production images, pushes them to
# ECR, and deploys them to the EC2 host through AWS Systems Manager.
#
# Does nothing until the AWS repository variables are set
# (see infra/aws/README.md). No long-lived AWS keys: GitHub OIDC assumes a role.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to deploy
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, push, and deploy
    # Only a push to this repository's main deploys. A pull request from a fork's
    # own "main" branch also matches the branches filter above, so the event and
    # repository are checked too; otherwise its code would run with the deploy role.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: Pick the image tag
        id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      - name: Build and push images
        run: infra/scripts/build-images.sh "$ECR_REGISTRY" "${{ steps.tag.outputs.tag }}" push
        env:
          BUILD_CACHE: gha
          # The web app's image is only needed when it runs on EC2 (the web profile).
          BUILD_WEB: ${{ contains(format(',{0},', vars.COMPOSE_PROFILES), ',web,') }}
          PUBLIC_API_URL: https://${{ vars.API_DOMAIN }}
          PUBLIC_MCP_URL: https://${{ vars.MCP_DOMAIN }}/mcp
          PUBLIC_WEB_URL: https://${{ vars.WEB_DOMAIN }}
          PLATFORM: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}

      - name: Deploy to EC2
        run: infra/scripts/remote-deploy.sh "${{ steps.tag.outputs.tag }}"
        env:
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES || 'edge,data' }}
          SSM_PATH: ${{ vars.SSM_PATH || '/tessel/prod' }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          MCP_DOMAIN: ${{ vars.MCP_DOMAIN }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
          RTC_DOMAIN: ${{ vars.RTC_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          LOG_GROUP: ${{ vars.LOG_GROUP }}

      - name: Check the live site
        run: |
          for url in "https://${{ vars.API_DOMAIN }}/health" "https://${{ vars.WEB_DOMAIN }}/" "https://${{ vars.ADMIN_DOMAIN }}/login"; do
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --max-time 10 "$url" >/dev/null; then
                echo "OK $url"; continue 2
              fi
              sleep 10
            done
            echo "Not reachable: $url" >&2; exit 1
          done
