name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # API integration tests run against a real Postgres, including row-level security.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tessel
          POSTGRES_PASSWORD: tessel
          POSTGRES_DB: tessel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessel -d tessel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Spend cap counters are tested against a real Redis.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_ADMIN_URL: postgres://tessel:tessel@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tessel
          POSTGRES_PASSWORD: tessel
          POSTGRES_DB: tessel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessel -d tessel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis-cache:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      redis-queue:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The example values match the CI services above.
      - run: cp .env.example .env

      - name: Migrate database
        run: pnpm db:migrate

      - name: Build web app
        run: pnpm --filter @tessel/web build

      - name: Install browser
        run: pnpm --filter @tessel/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    name: Production images (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Exposes the GitHub Actions cache to docker buildx in run steps.
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build images
        run: infra/scripts/build-images.sh tessel-ci "${{ github.sha }}" load
        env:
          BUILD_CACHE: gha

      - name: Boot the production stack and check it
        run: infra/scripts/smoke-test.sh tessel-ci "${{ github.sha }}"
