name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # API integration tests run against a real Postgres, including row-level security.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tessel
          POSTGRES_PASSWORD: tessel
          POSTGRES_DB: tessel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessel -d tessel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Spend cap counters are tested against a real Redis.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Start S3, SQS, Qdrant, and Neo4j
        run: infra/scripts/start-test-services.sh

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_ADMIN_URL: postgres://tessel:tessel@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
          TEST_S3_ENDPOINT: http://localhost:8333
          TEST_SQS_ENDPOINT: http://localhost:9324
          TEST_QDRANT_URL: http://localhost:6333
          TEST_NEO4J_URL: bolt://localhost:7687
          AWS_ACCESS_KEY_ID: tessel-local
          AWS_SECRET_ACCESS_KEY: tessel-local-secret

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tessel
          POSTGRES_PASSWORD: tessel
          POSTGRES_DB: tessel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessel -d tessel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis-cache:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      redis-queue:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The example values match the CI services above and the emulators below.
      - run: cp .env.example .env

      - name: Start S3, SQS, Qdrant, and Neo4j
        run: infra/scripts/start-test-services.sh

      - name: Migrate database
        run: pnpm db:migrate

      - name: Build web and admin apps
        run: pnpm --filter @tessel/web --filter @tessel/admin build

      - name: Install browser
        run: pnpm --filter @tessel/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    name: Production images (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Exposes the GitHub Actions cache to docker buildx in run steps.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      - name: Build images
        run: infra/scripts/build-images.sh tessel-ci "${{ github.sha }}" load
        env:
          BUILD_CACHE: gha

      - name: Boot the production stack and check it
        run: infra/scripts/smoke-test.sh tessel-ci "${{ github.sha }}"
