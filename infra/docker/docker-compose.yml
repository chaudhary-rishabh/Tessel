# Local development data services. The apps run on the host with `pnpm dev`.
# Credentials here are for local development only.
# Start: pnpm infra:up   Stop: pnpm infra:down

name: tessel

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tessel
      POSTGRES_PASSWORD: tessel
      POSTGRES_DB: tessel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessel -d tessel"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache: evicts least-recently-used keys when full, no persistence.
  redis-cache:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue: never evicts (BullMQ requirement) and persists jobs to disk.
  redis-queue:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:2026.10.1
    environment:
      NEO4J_AUTH: neo4j/tessel-local-password
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # S3-compatible object storage (SeaweedFS). Production uses Amazon S3.
  # Requests are signed with the credentials in seaweedfs/s3.json.
  objectstore:
    image: chrislusf/seaweedfs:3.99
    command:
      [
        "server",
        "-dir=/data",
        "-ip.bind=0.0.0.0",
        "-s3",
        "-s3.port=8333",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-s3.allowedOrigins=http://localhost:3000",
      ]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - objectstore-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # SQS-compatible queue (ElasticMQ). Production uses Amazon SQS. The app
  # creates the queue on start (STORAGE_AUTO_CREATE=true).
  sqs:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "127.0.0.1:9324:9324"

  # LiveKit for voice conversations, in dev mode (keys devkey / secret). The
  # voice agent (`pnpm --filter @tessel/voice dev`) and the API connect to it;
  # browsers on this machine reach it at ws://localhost:7880.
  livekit:
    image: livekit/livekit-server:v1.13.11
    # Media on one UDP port (and TCP as a fallback), offered at 127.0.0.1 so a
    # browser on this machine reaches the container on every OS.
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1", "--udp-port", "7882"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  objectstore-data:
  postgres-data:
  redis-queue-data:
  qdrant-data:
  neo4j-data:
